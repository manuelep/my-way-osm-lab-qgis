<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>html,body,#map{height:100%;margin:0}</style>
</head>
<body>
<div id="map"></div>
<script>
  var map = L.map('map').setView([45.223, 9.316], 12);
  L.tileLayer('http://localhost:8082/wmts/osm4sking/webmercator/{z}/{x}/{y}.png', {
    opacity: 1
  }).addTo(map);
</script>
</body>
</html>
