<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <style>html,body,#map{height:100%;margin:0}</style>
</head>
<body>
<div id="map"></div>
<script>
  // 45.016, 6.868 Oulx
  // 46.237, 10.830 Campiglio
  // 46.536, 10.137 Livigno
  var map = L.map('map').setView([46.536, 10.137], 15);
  L.tileLayer('http://localhost:8082/wmts/osm4sking/webmercator/{z}/{x}/{y}.png', {
      maxZoom: 18, // Assicurati che coincida con i livelli di seed in mapproxy.yaml[cite: 2]
      minZoom: 13,
      attribution: '&copy; OpenStreetMap contributors, QGIS Server, MapProxy'
  }).addTo(map);


  var map = L.map('map').setView([46.237, 10.830], 15);
  L.tileLayer('http://localhost:8082/wmts/osm4sking/webmercator/{z}/{x}/{y}.png', {
    opacity: 1
  }).addTo(map);
</script>
</body>
</html>
